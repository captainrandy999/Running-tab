name: Build Running Tab Android widget

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "${SDKMANAGER}" ]; then echo "Android SDK manager is missing"; exit 1; fi
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reuse local test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: running-tab-widget-debug-signing-v1
      - name: Compile Android app and widget
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Running-Tab-Widget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk running-tab-widget.apk
          if gh release view widget-preview >/dev/null 2>&1; then
            gh release upload widget-preview running-tab-widget.apk --clobber
          else
            gh release create widget-preview running-tab-widget.apk \
              --title "Running Tab Android widget (preview)" \
              --notes "Android app with read-only Money, To-Do, and Shopping widget. Import your previous web-app data via Data & backup → Restore backup." \
              --prerelease
          fi

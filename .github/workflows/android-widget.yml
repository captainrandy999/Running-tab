name: Build Running Tab Android widget

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "${SDKMANAGER}" ]; then echo "Android SDK manager is missing"; exit 1; fi
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # A stable signing identity is essential: Android refuses updates signed with
      # a different key. Never publish a build if the pinned key is missing.
      - name: Restore stable preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/running-tab-preview.keystore
          key: running-tab-preview-signing-v1
      - name: Prepare and verify preview signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/running-tab-preview.keystore"
          PIN="android/preview-signing.sha256"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            if [ -f "$PIN" ]; then
              echo "::error::Signing key cache missing! Refusing to rotate signing certificate and break Android updates."
              echo "::error::Restore the key securely or provision it as an Actions secret; DO NOT publish another APK."
              exit 1
            fi
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -storepass android -keypass android -alias running-tab \
              -keyalg RSA -keysize 3072 -validity 20000 \
              -dname "CN=Running Tab Preview,O=Running Tab,C=CA" -noprompt
          fi
          FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE" \
              -storepass android -alias running-tab \
              | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$FINGERPRINT" ]; then echo "::error::Cannot read signing fingerprint"; exit 1; fi
          if [ -f "$PIN" ]; then
            EXPECTED="$(tr -d '[:space:]' < "$PIN" | tr '[:lower:]' '[:upper:]')"
            if [ "$FINGERPRINT" != "$EXPECTED" ]; then
              echo "::error::Signing certificate mismatch! Refusing to publish an un-installable update."
              exit 1
            fi
            echo "Verified stable preview certificate fingerprint: $FINGERPRINT"
            SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias running-tab | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
            if [ -z "$SHA1" ]; then echo "::error::Cannot read Android OAuth SHA-1"; exit 1; fi
            echo "ANDROID_OAUTH_SHA1=$SHA1"
          else
            echo "::notice::INITIAL_PREVIEW_SIGNING_FINGERPRINT=$FINGERPRINT"
            echo "::warning::Pin this fingerprint in android/preview-signing.sha256 before publishing any later builds."
          fi
      - name: Compile Android app and widget
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Running-Tab-Widget-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk running-tab-widget.apk
          if gh release view widget-preview >/dev/null 2>&1; then
            gh release upload widget-preview running-tab-widget.apk --clobber
          else
            gh release create widget-preview running-tab-widget.apk \
              --title "Running Tab Android widget (preview)" \
              --notes "Android app with read-only Money, To-Do, and Shopping widget. Import your previous web-app data via Data & backup → Restore backup." \
              --prerelease
          fi
